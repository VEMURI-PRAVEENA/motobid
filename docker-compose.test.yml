services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motobid
      POSTGRES_PASSWORD: motobid
      POSTGRES_DB: motobid_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U motobid -d motobid_test']
      interval: 3s
      timeout: 3s
      retries: 15
  redis-test:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
